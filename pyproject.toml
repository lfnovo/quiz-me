[project]
name = "quiz-me"
version = "0.2.0"
description = "AI-powered question generation library using Langgraph flows"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Luis Novo", email = "luis@lfnovo.com"}
]
license = {text = "MIT"}
keywords = [
    "ai",
    "llm",
    "education",
    "questions",
    "quiz",
    "langgraph",
    "langchain",
    "question-generation",
    "educational-technology",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "langgraph>=1.0.0",
    "langchain-core>=1.0.0",
    "pydantic>=2.10",
    "ai-prompter>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/lfnovo/quiz-me"
Repository = "https://github.com/lfnovo/quiz-me"
Issues = "https://github.com/lfnovo/quiz-me/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: marks tests as requiring real API keys (deselect with '-m \"not live\"')",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.0",
    "esperanto>=2.10.0",
    "ipykernel",
]
